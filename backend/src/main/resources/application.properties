# Nombre de la aplicacion Spring
spring.application.name=demo
# Conexion a MySQL: DB_URL, DB_USER y DB_PASSWORD vienen de variables de entorno (sin secretos en Git).
#Se añaden valores por defecto (ej. root) para facilitar el arranque en desarrollo local sin requerir variables de entorno obligatorias.
# yearIsDateType=false hace que la columna YEAR llegue como numero y no como fecha.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authentifpcar?yearIsDateType=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# update: Permite que Hibernate actualice o cree las tablas automáticamente en local.
# show-sql=true activado temporalmente para depuración de consultas SQL en consola.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Verificacion de correo: el envio esta simulado (el enlace sale por consola)
app.mail.from=no-reply@autentifpcar.local
app.base-url=http://localhost:8080
# Clave para firmar los JWT (minimo 32 caracteres)
#Se añade valor por defecto para evitar fallos al arrancar en local
app.jwt.secret=${JWT_SECRET:claveSecretaSuperSeguraParaDesarrolloLocal123456789}